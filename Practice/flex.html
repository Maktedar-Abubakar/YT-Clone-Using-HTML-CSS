<!DOCTYPE html>
<html>
  <head>
    <title>Flex Practice</title>
    <body style="padding-bottom: 1000px;">
    <div style="display: flex; flex-direction: row;">
    <div style="background-color: rgb(182, 235, 235)">div1</div>
      <div style="background-color: rgb(149, 149, 250)">div2</div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px">
      <div style="background-color: rgb(182, 235, 235); width: 100px">
        100px
      </div>
      <div style="background-color: rgb(149, 149, 250); flex: 1">div2</div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px">

        100px
      </div>
      <div style="background-color: rgb(149, 149, 250); flex: 1">div2</div>
      <div style="background-color: rgb(182, 235, 235); flex: 2">flex2</div>
    </div>

    <div
      style="
        height: 70px;
        border-width: 1px;
        border-style: solid;
        border-color: gray;
        display: flex;
        flex-direction: row;

        justify-content: space-between;
      "
    >
      <div style="background-color: rgb(182, 235, 235); width: 100px">
        100px
      </div>
      <div style="background-color: rgb(149, 149, 250); width: 100px">div2</div>
      <div style="background-color: rgb(182, 235, 235); width: 100px">
        flex2
      </div>
    </div>

    <div
      style="
        height: 70px;
        border-width: 1px;
        border-style: solid;
        border-color: gray;
        display: flex;
        flex-direction: row;
        margin-top: 30px;
      "
    >
      <div style="background-color: rgb(182, 235, 235); width: 100px">

      </div>
      <div style="background-color: rgb(149, 149, 250); width: 100px">div2</div>
      <div style="background-color: rgb(182, 235, 235); width: 100px">
        flex2
      </div>
    </div>

    <div
      style="
        height: 70px;
        border-width: 1px;
        border-style: solid;
        border-color: gray;
        display: flex;
        flex-direction: row;
        margin-top: 30px;
        justify-content: space-between;
        align-items: start;
      "
    >
      <div style="background-color: rgb(182, 235, 235); width: 100px">
        100px

      <div style="background-color: rgb(149, 149, 250); width: 100px">div2</div>
      <div style="background-color: rgb(182, 235, 235); width: 100px">

  </head>
